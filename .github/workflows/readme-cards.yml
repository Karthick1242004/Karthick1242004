name: README cards

on:
  schedule:
    - cron: "17 2 * * *" # daily, 07:47 in India
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - fonts/**
      - assets/portrait.jpg
      - .github/workflows/readme-cards.yml

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fontTools (pyftsubset)
        run: pip install "fonttools==4.55.0"

      - name: Refresh contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_profile_data.py

      - name: Render README cards (hero, graph, activity, tiles, repos)
        run: python scripts/render_readme_cards.py

      # Commits pushed with GITHUB_TOKEN do not start new workflow runs, so this cannot loop.
      - name: Commit the cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/profile.json cards readme.md
          if git diff --cached --quiet; then
            echo "Cards unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Refresh README cards"
          git push
